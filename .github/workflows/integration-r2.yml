name: integration-r2

# The image step against the real dev bucket (plan P1-24). Manual only (workflow_dispatch),
# never on pull_request: it uses the `dev` environment's R2 token, which is scoped to the
# `moviespk-dev` bucket. The test uses two test-only movie ids and deletes its objects.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-r2
  cancel-in-progress: false

jobs:
  r2:
    if: github.repository == 'discortx/moviesPK'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "./scraper[dev]"
      - name: Image step and maintenance (P2-10) against moviespk-dev
        working-directory: scraper
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: python -m pytest tests/integration_r2 -v -m r2 -p no:cacheprovider
