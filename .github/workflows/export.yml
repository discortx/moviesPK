name: export

# Weekly export (plan §10.5, §19, P2-05): movies, movie_aliases and cinemas as gzip JSON
# plus manifest.json, kept as an artifact for 60 days (the TMDB 6-month rule, §11.3.5:
# 98 days worst-case data age + 60 days = 158 < 180). Never stored in R2. Public data only
# (no personal data, no secrets). Restore: scripts/restore_export.py (runbook "Restore
# from export"). Environment: SCRAPE_ENVIRONMENT, like the scrape workflows. Never runs on
# pull_request (it uses secrets).
on:
  schedule:
    - cron: "41 3 * * 0" # Sundays 08:41 PKT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export
  cancel-in-progress: false

jobs:
  export:
    if: github.repository == 'discortx/moviesPK'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ vars.SCRAPE_ENVIRONMENT || 'dev' }}
    env:
      MONGODB_DB: ${{ vars.MONGODB_DB }}
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./scraper

      - name: Export
        env:
          MONGODB_URI_SCRAPER: ${{ secrets.MONGODB_URI_SCRAPER }}
        run: python -m moviespk_scraper run --job export --export-dir export --config-dir scraper/config

      - name: Upload export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: export-${{ vars.MONGODB_DB }}-${{ github.run_id }}
          path: export/
          retention-days: 60
          if-no-files-found: error
