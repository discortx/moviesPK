name: ci-scraper

# Path filtering is done by the `changes` job (not `on.*.paths`) so that the required
# status check reports "skipped" (= passing) instead of blocking PRs that do not touch
# the scraper. Never use the secrets context in this workflow (it runs on pull_request).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-scraper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: scraper-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(scraper/|shared/|scripts/|\.github/workflows/ci-scraper\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: scraper-test
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MONGODB_URI_SCRAPER: mongodb://localhost:27017
      MONGODB_DB: moviespk_ci_dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "scraper[dev]"
          npm ci --prefix scripts
      - name: Ruff
        working-directory: scraper
        run: |
          ruff check . ../scripts
          ruff format --check . ../scripts
      - name: Mypy
        working-directory: scraper
        run: mypy
      - name: cities.json up to date
        run: python scripts/gen_constants.py --check
      - name: Pytest (unit, contract, integration)
        working-directory: scraper
        run: >-
          pytest
          --cov=moviespk_scraper.core --cov=moviespk_scraper.pipeline
          --cov-report=term-missing
      - name: pip-audit
        run: pip-audit --skip-editable
