name: healthcheck

# Hourly health check (plan §10.5, §18.1, P2-08): the site home page, /api/v1/health and
# one current poster from the image Worker. A check that fails is retried after 2 minutes;
# a second failure opens [alert] site: down or [alert] images: down, and a passing check
# closes it. The image base follows SCRAPE_ENVIRONMENT (posters live in that environment's
# bucket): dev → moviespk-img-dev, production → moviespk-img.
# Test dispatch (P2-08 acceptance): set site_url or image_base to a non-existent path.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      site_url:
        description: "Override the site URL (test: a non-existent path)"
        required: false
        default: ""
      image_base:
        description: "Override the image base (test: a non-existent path)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: healthcheck
  cancel-in-progress: false

jobs:
  health:
    if: github.repository == 'discortx/moviesPK'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./scraper

      - name: Check site, API and one poster
        env:
          SITE_URL: ${{ inputs.site_url || 'https://moviespk-web.vercel.app' }}
          API_URL: https://moviespk-api.vercel.app
          IMAGE_BASE: ${{ inputs.image_base || (vars.SCRAPE_ENVIRONMENT == 'production' && 'https://moviespk-img.moviespk.workers.dev' || 'https://moviespk-img-dev.moviespk.workers.dev') }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/healthcheck.py
