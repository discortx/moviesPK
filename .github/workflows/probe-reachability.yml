# TEMPORARY (plan P0-09). Lives only on the scratch branch probe/reachability; never merge.
# For each candidate: fetch robots.txt, then make ONE GET to its main endpoint with the real
# User-Agent, and record status + whether a challenge page came back. No secrets.
name: probe-reachability

on:
  push:
    branches: [probe/reachability]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UA: ${{ vars.SCRAPER_USER_AGENT || 'MoviesPKBot/1.0 (+https://github.com/discortx/moviesPK)' }}
    steps:
      - name: Probe candidates
        run: |
          set -u
          probe() {
            id="$1"; url="$2"
            host=$(echo "$url" | sed -E 's#^(https?://[^/]+).*#\1#')
            r=$(curl -s -o /dev/null -L --max-redirs 5 -m 30 -A "$UA" -w '%{http_code}' "$host/robots.txt" || echo 000)
            sleep 2
            body=$(mktemp)
            code=$(curl -s -o "$body" -L --max-redirs 5 -m 30 -A "$UA" -w '%{http_code}' "$url" || echo 000)
            size=$(wc -c < "$body")
            if grep -qiE 'cf-chl|challenge-platform|just a moment|attention required|captcha|access denied' "$body"; then
              challenge=yes
            else
              challenge=no
            fi
            if [ "$code" = 200 ] && [ "$challenge" = no ] && [ "$size" -gt 500 ]; then ok=reachable; else ok=NOT-reachable; fi
            echo "| $id | $r | $code | $size | $challenge | $ok |" | tee -a "$GITHUB_STEP_SUMMARY"
            rm -f "$body"
            sleep 2
          }
          {
            echo "### Runner reachability $(date -u +%Y-%m-%dT%H:%MZ) (GitHub-hosted ubuntu-latest)"
            echo
            echo "| cinema | robots.txt | main GET | bytes | challenge | result |"
            echo "|---|---|---|---|---|---|"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          probe cinepax-packages-mall          "https://web.cinepax.com/api/movies?cinemaId=0000000014"
          probe cinepax-world-trade-center     "https://web.cinepax.com/api/movies?cinemaId=0000000011"
          probe cinepax-ocean-mall             "https://web.cinepax.com/api/movies?cinemaId=0000000002"
          probe universal-emporium-mall-lahore "https://universalcinemas.com/browsing/Cinemas/Details/8888"
          probe cinestar-township-lahore       "https://cinestar.pk/browsing/Cinemas/Details/0005"
