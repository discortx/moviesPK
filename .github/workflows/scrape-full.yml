name: scrape-full

# The full scrape (plan §10.5, P1-13): every enabled cinema, 7 days ahead.
# Environment: the repository variable SCRAPE_ENVIRONMENT selects `dev` (default; dev
# database) or `production`. Switching needs no code change (P1-13: dev first).
# Exit code 1 (any cinema failed/blocked/drift) fails the run, so GitHub's failure email
# fires; alerts go to GitHub Issues. Never runs on pull_request (it uses secrets).
on:
  schedule:
    - cron: "7 2,14 * * *" # 07:07 and 19:07 PKT, off the hour
  workflow_dispatch:
    inputs:
      cinema:
        description: "Only this cinema id (optional)"
        required: false
        default: ""
      dry_run:
        description: "Dry run: fetch and check, write nothing, post no issues"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  full:
    if: github.repository == 'discortx/moviesPK'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ vars.SCRAPE_ENVIRONMENT || 'dev' }}
    env:
      SCRAPER_USER_AGENT: ${{ vars.SCRAPER_USER_AGENT }}
      MONGODB_DB: ${{ vars.MONGODB_DB }}
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/pyproject.toml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./scraper
          npm ci --prefix scripts

      - name: Ensure indexes (idempotent)
        if: ${{ !inputs.dry_run }}
        env:
          MONGODB_URI_SCRAPER: ${{ secrets.MONGODB_URI_SCRAPER }}
        run: node scripts/create_indexes.js

      - name: Scrape
        env:
          MONGODB_URI_SCRAPER: ${{ secrets.MONGODB_URI_SCRAPER }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CINEMA: ${{ inputs.cinema }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(run --job full --config-dir scraper/config)
          if [ -n "$CINEMA" ]; then
            if ! [[ "$CINEMA" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              echo "::error::cinema must be a slug"; exit 2
            fi
            args+=(--cinema "$CINEMA")
          fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python -m moviespk_scraper "${args[@]}"

      - name: Upload debug payloads
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          retention-days: 7
          if-no-files-found: ignore
