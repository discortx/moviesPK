# Cinema list (plan §8.3, P0-08). Draft: every venue stays `enabled: false` until its
# P0-09 runner probe passes and its adapter exists (P2-01).
#
# - location is [lng, lat], taken from a map by hand (no geocoding).
# - evidence comes from scripts/snapshot_evidence.py; re-run it whenever the canary reports
#   a robots/terms change, and paste the new snippet here.
# - Never `robots_policy: ignore`. `permission_granted` needs `permission_ref`.
# - Investigation notes: docs/cinema-investigation/<chain>.md

# --- Adapter A: Cinepax public JSON (docs/cinema-investigation/cinepax.md) ---

- id: cinepax-packages-mall
  chain: cinepax
  adapter: cinepax
  branch: "0000000014"
  fetch_mode: json
  base_url: https://web.cinepax.com
  booking_url_template: https://web.cinepax.com/pages/booking.html?filmCode={filmId}&movie={movieTitle}&cinemaId={branch}&cinema={cinemaName}
  name: Cinepax Packages Mall
  address: Packages Mall, Walton Road, Lahore
  city: lahore
  location: [74.35692149646812, 31.47168923714777]
  min_delay_ms: 1500
  max_concurrency: 1
  enabled: false
  seats_allowed: false # seatsAvailable is in the session JSON; decide under §10.6
  robots_policy: respect
  evidence: &cinepax_evidence
    checked_at: "2026-11-25"
    robots_sha256: null # no robots.txt (HTTP 404) → everything allowed
    terms_url: https://web.cinepax.com/api/cms/pages/terms
    terms_sha256: 62dc051de906e2d48dd27ce4df9a5f7e9a554a6b2b8ba4153b6bf407546a2d56
    endpoints:
      - path: /api/cinemas
        allowed: true
      - path: /api/movies
        allowed: true

